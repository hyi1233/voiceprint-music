<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="dsh-design" content="desktop">
<title>沉浸模式 · Voiceprint 声纹音乐</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%;overflow:hidden;background:var(--color-base)}
  body{position:relative;height:100%;border-radius:var(--window-radius);overflow:hidden;
    background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased}

  /* —— 布局（与全站一致）—— */
  .layout{position:absolute;inset:0;display:flex;z-index:2}
  .sidebar{width:206px;flex:none;display:flex;flex-direction:column;
    padding:48px 16px 18px;background:oklch(99% 0 0)}
  .side-foot{margin-top:auto;padding:0 2px}
  .side-foot .gh-link{margin-left:auto}
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:0 8px;margin-bottom:40px}
  .brand b{font-size:16px;font-weight:600;letter-spacing:.14em;color:oklch(16% 0 0);white-space:nowrap}
  .brand span{font-size:11px;font-weight:400;letter-spacing:.24em;color:oklch(52% 0 0);white-space:nowrap}
  .nav-label{padding:0 10px;margin:0 0 12px;font-size:11px;font-weight:500;letter-spacing:.24em;color:oklch(53% 0 0)}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav a{display:flex;align-items:center;gap:13px;height:42px;padding:0 12px;border-radius:10px;
    color:oklch(42% 0 0);font-size:16px;text-decoration:none;cursor:pointer;transition:background .2s,color .2s}
  .nav a svg{width:19px;height:19px;flex:none;stroke:currentColor;stroke-width:1.6;fill:none;
    stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .nav a:hover{background:oklch(20% 0 0 / .05);color:oklch(16% 0 0)}
  .nav a.active{color:oklch(16% 0 0);font-weight:600;background:oklch(20% 0 0 / .07)}
  .nav a.active svg{opacity:1;stroke-width:1.9}
  .divider{height:1px;background:var(--color-line);margin:22px 10px}

  .main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--color-bg)}
  .topbar{position:relative;z-index:2;height:64px;flex:none;display:flex;align-items:center;gap:22px;padding:0 30px}
  .chips{display:flex;gap:6px;align-items:center}
  .chip{height:30px;padding:0 15px;border-radius:999px;border:0;background:transparent;
    color:oklch(50% 0 0);font-size:var(--text-xs);letter-spacing:.1em;cursor:pointer;
    transition:.2s;white-space:nowrap}
  .chip:hover{background:oklch(20% 0 0 / .05);color:oklch(16% 0 0)}
  .chip.on{color:oklch(100% 0 0);background:oklch(16% 0 0)}

  /* —— 页面头 —— */
  .content{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;padding:24px 30px 92px}
  .page-head{flex:none;margin-bottom:18px}
  .kicker{font-size:11px;font-weight:600;letter-spacing:.3em;color:oklch(52% 0 0)}
  .page-head h1{font-size:var(--text-3xl);font-weight:750;letter-spacing:.04em;margin:6px 0 6px;color:oklch(16% 0 0)}
  .page-head p{font-size:var(--text-sm);color:oklch(52% 0 0)}

  /* —— 主体：左设置 / 右预览 —— */
  .work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(360px,44%) 1fr;gap:24px}
  .panel{min-height:0;overflow-y:auto;padding-right:6px}
  .panel::-webkit-scrollbar{width:6px}
  .panel::-webkit-scrollbar-thumb{background:oklch(20% 0 0 / .12);border-radius:6px}
  .sec{margin-bottom:22px}
  .sec-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .sec-hd .bar{width:3px;height:15px;border-radius:2px;background:oklch(18% 0 0)}
  .sec-hd h2{font-size:var(--text-md);font-weight:650;color:oklch(18% 0 0)}
  .sec-hd .en{font-size:11px;letter-spacing:.18em;color:oklch(50% 0 0)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .opt{min-height:46px;padding:8px 10px;border:1px solid var(--color-line);border-radius:12px;
    background:oklch(100% 0 0);cursor:pointer;text-align:left;transition:.2s;
    display:flex;flex-direction:column;justify-content:center;gap:3px}
  .opt:hover{border-color:oklch(18% 0 0 / .4)}
  .opt.on{background:oklch(16% 0 0);border-color:oklch(16% 0 0);color:oklch(100% 0 0)}
  .opt .nm{font-size:var(--text-sm);font-weight:600;white-space:nowrap}
  .opt .ds{font-size:11px;opacity:.62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opt.on .ds{color:oklch(100% 0 0 / .72)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row .opt{min-width:76px}
  .toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:var(--text-sm);color:oklch(30% 0 0)}
  .toggle input{appearance:none;width:44px;height:26px;border-radius:999px;background:oklch(20% 0 0 / .16);
    position:relative;cursor:pointer;transition:.2s;flex:none}
  .toggle input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;
    background:#fff;transition:.2s;box-shadow:0 1px 3px oklch(0 0 0 / .2)}
  .toggle input:checked{background:oklch(18% 0 0)}
  .toggle input:checked::after{left:23px}
  .slider{display:flex;align-items:center;gap:12px}
  .slider input[type=range]{flex:1;height:26px;accent-color:oklch(18% 0 0);cursor:pointer}
  .slider .v{font-size:var(--text-sm);color:oklch(30% 0 0);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}

  /* —— 预览舞台：暗底情景歌词（复用 player 全屏歌词层视觉）—— */
  .preview-wrap{position:relative;min-height:0;border-radius:18px;overflow:hidden;
    --c1:oklch(45% .05 230);--c2:oklch(35% .06 270);--c3:oklch(55% .04 190);--veil:1;--cover-op:1;
    --la:oklch(88% .09 82);--lg:0 0 20px oklch(86% .15 74 / .9),0 0 46px oklch(80% .17 64 / .55);
    --act-size:clamp(40px,4.4vw,70px);
    background:oklch(9% 0 0)}
  .pv-stage{position:absolute;inset:0;overflow:hidden}
  .pv-bg{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;
    filter:blur(78px) saturate(1.15) brightness(.72);transform:scale(1.06);
    opacity:var(--cover-op);transition:opacity .7s ease}
  .pv-glow{position:absolute;inset:-10%;pointer-events:none;filter:blur(60px);opacity:.72}
  .pv-glow i{position:absolute;display:block;border-radius:50%;transition:background .9s ease;mix-blend-mode:screen}
  .pv-glow i.g1{width:62%;height:70%;left:-8%;top:-14%;background:var(--c1);animation:float1 18s ease-in-out infinite alternate}
  .pv-glow i.g2{width:58%;height:64%;right:-10%;top:6%;background:var(--c2);animation:float2 22s ease-in-out infinite alternate}
  .pv-glow i.g3{width:70%;height:52%;left:14%;bottom:-16%;background:var(--c3);animation:float3 26s ease-in-out infinite alternate}
  @keyframes float1{to{transform:translate(9%,7%) scale(1.12)}}
  @keyframes float2{to{transform:translate(-8%,10%) scale(1.08)}}
  @keyframes float3{to{transform:translate(6%,-8%) scale(1.14)}}
  .pv-rays{position:absolute;inset:-30%;display:none;pointer-events:none;mix-blend-mode:screen;
    background:conic-gradient(from 0deg at 50% 0%,transparent 0deg,var(--c3) 12deg,transparent 26deg,
      var(--c1) 44deg,transparent 60deg,var(--c2) 82deg,transparent 100deg,
      var(--c3) 128deg,transparent 150deg,var(--c1) 180deg,transparent 210deg);
    animation:raySpin 40s linear infinite;filter:blur(22px);opacity:.5}
  @keyframes raySpin{to{transform:rotate(360deg)}}
  #pvStars{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
  .pv-veil{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,transparent 18%,oklch(6% 0 0 / calc(.52 * var(--veil))) 82%),
      linear-gradient(oklch(6% 0 0 / calc(.20 * var(--veil))),oklch(6% 0 0 / calc(.42 * var(--veil))))}
  .preview-wrap[data-bg="0"] .pv-glow,.preview-wrap[data-bg="1"] .pv-glow,.preview-wrap[data-bg="3"] .pv-glow{display:block}
  .preview-wrap[data-bg="1"] .pv-bg{opacity:calc(var(--cover-op) * .35)}
  .preview-wrap[data-bg="2"] #pvStars{display:block}
  .preview-wrap[data-bg="2"] .pv-bg,.preview-wrap[data-bg="2"] .pv-glow{display:none}
  .preview-wrap[data-bg="3"] .pv-rays{display:block}
  .preview-wrap[data-bg="4"] .pv-bg,.preview-wrap[data-bg="4"] .pv-glow{display:none}

  .pv-lines{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:clamp(10px,1.8vw,20px);padding:0 8%;}
  .pv-lines .line{font-size:15px;line-height:1.3;letter-spacing:.08em;
    color:oklch(100% 0 0/.2);text-align:center;font-weight:600;transition:color .5s,font-size .5s,opacity .5s,transform .5s}
  .pv-lines .line.active{font-size:var(--act-size);font-weight:800;letter-spacing:.02em;color:oklch(100% 0 0/.92)}
  .pv-lines .line .ch{display:inline-block;white-space:pre;transition:color .3s,transform .3s,text-shadow .3s}
  .pv-lines .line.active .ch.sung{color:var(--la)}
  .pv-lines .line.active .ch.singing{color:var(--la);transform:translateY(-6px) scale(1.14);text-shadow:var(--lg)}
  .pv-lines[data-style="1"] .line.active .ch.singing{animation:sweep 1s ease-out}
  @keyframes sweep{0%{text-shadow:-14px 0 10px var(--la);opacity:.55}100%{text-shadow:var(--lg);opacity:1}}
  .pv-lines[data-style="2"] .line.active .ch.sung{animation:cloudIn .6s ease-out both}
  @keyframes cloudIn{from{opacity:0;transform:translateY(12px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
  .pv-lines[data-style="3"] .line.active .ch.singing{animation:burst .55s ease-out both}
  @keyframes burst{0%{text-shadow:var(--lg);transform:scale(1.14)}
    45%{text-shadow:6px -6px 12px oklch(70% .2 30),-6px 6px 12px oklch(70% .2 210),0 0 20px var(--la);transform:scale(1.3)}
    100%{text-shadow:var(--lg);transform:scale(1.14)}}
  .pv-lines[data-style="4"] .line.active .ch.singing{animation:breathe 1.15s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.32) translateY(-5px)}}
  .pv-lines[data-style="5"] .line.active .ch.sung{transform:translateY(var(--wave,0));color:var(--la)}
  .pv-lines[data-style="5"] .line.active .ch.singing{transform:translateY(var(--wave,0)) scale(1.2)}
  .pv-lines[data-style="6"] .line.active .ch.singing{animation:cadenza 1.4s ease-in-out infinite}
  @keyframes cadenza{0%,100%{transform:translateY(0) rotate(0) scale(1.1)}50%{transform:translateY(-8px) rotate(2deg) scale(1.2)}}
  .pv-lines[data-style="7"] .line.active .ch.sung{transform:translateY(var(--wave,0));opacity:.85}
  .pv-lines[data-style="7"] .line.active .ch.singing{transform:translateY(-14px) scale(1.16);letter-spacing:.18em}
  .pv-lines[data-style="8"] .line.active .ch.singing{animation:fume 1.6s ease-out both}
  @keyframes fume{0%{filter:blur(4px);transform:scale(.9);opacity:.4}
    60%{filter:blur(0);transform:scale(1.3);text-shadow:var(--lg)}100%{transform:scale(1.16)}}
  .pv-lines[data-style="9"] .line.active .ch.singing{animation:pendolo 1.1s ease-in-out infinite;transform-origin:top center}
  @keyframes pendolo{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  .pv-lines[data-style="10"] .line.active{animation:glitch 2.4s steps(1) infinite}
  @keyframes glitch{0%,92%,100%{text-shadow:none;transform:none}
    94%{text-shadow:-2px 0 var(--la),2px 0 oklch(70% .18 210);transform:translateX(1px)}
    96%{text-shadow:2px 0 var(--la),-2px 0 oklch(70% .18 30);transform:translateX(-1px)}}

  .pv-badge{position:absolute;top:16px;left:16px;z-index:3;display:flex;align-items:center;gap:7px;
    padding:7px 12px;border-radius:999px;background:oklch(0 0 0 / .32);backdrop-filter:blur(10px);
    color:oklch(100% 0 0 / .82);font-size:11px;letter-spacing:.08em}
  .pv-badge i{width:6px;height:6px;border-radius:50%;background:oklch(88% .09 82);box-shadow:0 0 8px oklch(88% .09 82)}
  .pv-cap{position:absolute;bottom:14px;left:0;right:0;z-index:3;text-align:center;
    font-size:11px;letter-spacing:.12em;color:oklch(100% 0 0 / .5)}

  .nav-toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,12px);z-index:99;
    padding:10px 20px;border-radius:999px;background:oklch(20% 0 0 / .92);color:#fff;font-size:var(--text-sm);
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
  .nav-toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>
(function(){
  // —— 菜单联动：跳真实页面 / 设置占位 ——
  var VIEW_URL={'首页':'home.html','搜索':'search.html','歌单':'playlist.html','排行榜':'rank.html','沉浸模式':'immersive.html','设置':'settings.html'};
  var chipEls=[].slice.call(document.querySelectorAll('.chip')),navEls=[].slice.call(document.querySelectorAll('.nav a'));
  var toast=document.getElementById('toast'),toastTimer;
  function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.classList.remove('show');},1500);}
  function setView(label){
    chipEls.forEach(function(c){c.classList.toggle('on',c.dataset.view===label);});
    navEls.forEach(function(n){n.classList.toggle('active',n.dataset.view===label);});
    if(VIEW_URL[label]){location.href=VIEW_URL[label];}
  }
  chipEls.forEach(function(c){c.addEventListener('click',function(){setView(c.dataset.view);});});
  navEls.forEach(function(n){n.addEventListener('click',function(){setView(n.dataset.view);});});

  // —— 与播放页共用的一套定义 ——
  var LY_STYLES=[
    {id:0,name:'逐字点亮',desc:'暖金 · 默认'},{id:1,name:'流光扫描',desc:'classic 光带'},
    {id:2,name:'云阶淡入',desc:'partita 云阶'},{id:3,name:'粒子爆发',desc:'hanabi 花火'},
    {id:4,name:'呼吸缩放',desc:'随拍呼吸'},{id:5,name:'波浪跳动',desc:'错落起伏'},
    {id:6,name:'心象',desc:'cadenza 浮动'},{id:7,name:'语义排列',desc:'partita 错位'},
    {id:8,name:'浮名',desc:'fume 景深'},{id:9,name:'时计',desc:'pendolo 钟摆'},
    {id:10,name:'凝彩',desc:'sonnet 胶片'}
  ];
  var BG_MODES=[{id:0,name:'封面光晕'},{id:1,name:'隐现流体'},{id:2,name:'空·星象'},{id:3,name:'灵光'},{id:4,name:'纯净'}];
  var COLORS=['oklch(45% .05 230)','oklch(35% .06 270)','oklch(55% .04 190)'];
  var preview=document.getElementById('preview'),pvLines=document.getElementById('pvLines');

  // 样式按钮
  var styleGrid=document.getElementById('styleGrid');
  LY_STYLES.forEach(function(s){
    var b=document.createElement('button');
    b.className='opt'+(s.id===0?' on':'');b.dataset.style=s.id;
    b.innerHTML='<span class="nm">'+s.name+'</span><span class="ds">'+s.desc+'</span>';
    b.addEventListener('click',function(){
      [].forEach.call(styleGrid.children,function(x){x.classList.remove('on');});
      b.classList.add('on');pvLines.dataset.style=s.id;
    });
    styleGrid.appendChild(b);
  });
  // 背景按钮
  var bgGrid=document.getElementById('bgGrid');
  BG_MODES.forEach(function(m){
    var b=document.createElement('button');
    b.className='opt'+(m.id===0?' on':'');b.dataset.bg=m.id;
    b.innerHTML='<span class="nm">'+m.name+'</span>';
    b.addEventListener('click',function(){
      [].forEach.call(bgGrid.children,function(x){x.classList.remove('on');});
      b.classList.add('on');preview.dataset.bg=m.id;
      if(m.id===2)startStars();
    });
    bgGrid.appendChild(b);
  });
  // 暗角
  document.getElementById('vignette').addEventListener('change',function(e){preview.style.setProperty('--veil',e.target.checked?'1':'0');});
  // 主色写入光晕
  COLORS.forEach(function(c,i){preview.style.setProperty('--c'+(i+1),c);});
  // 速度
  var speeds=[1,1.25,1.5,2,0.75],speedRow=document.getElementById('speedRow'),spIdx=0;
  speeds.forEach(function(s,i){
    var b=document.createElement('button');
    b.className='opt'+(i===0?' on':'');b.textContent=(s===1?'1.0×':s+'×');
    b.addEventListener('click',function(){
      [].forEach.call(speedRow.children,function(x){x.classList.remove('on');});
      b.classList.add('on');spIdx=i;
    });
    speedRow.appendChild(b);
  });
  // 字号
  var fs=document.getElementById('fontSize'),fsv=document.getElementById('fontSizeV');
  fs.addEventListener('input',function(){preview.style.setProperty('--act-size',fs.value+'px');fsv.textContent=fs.value+'px';});
  preview.style.setProperty('--act-size',fs.value+'px');

  // —— 预览逐字点亮虚拟时钟 ——
  var demo=['夜色漫过安静的窗台','星光落进尘埃','我把心事折成一只船','驶向你的星海','时间在耳边慢下来','我们都不必说再见'];
  demo.forEach(function(text){
    var line=document.createElement('div');line.className='line';
    [].forEach.call(text,function(ch){var s=document.createElement('span');s.className='ch';s.textContent=ch;line.appendChild(s);});
    pvLines.appendChild(line);
  });
  var lines=[].slice.call(pvLines.querySelectorAll('.line'));
  var CHAR_MS=300,GAP_MS=560,pos=0,last=0;
  function tick(t){
    var dt=last?t-last:16;last=t;if(dt>200)dt=16;
    pos+=dt*speeds[spIdx];
    // 先独立算整曲时长：只有当 pos 真的越过整曲才循环回 0，
    // 否则（命中当前行时）不能重置——之前的写法用"已结束行累计"当 total，pos>=total 恒成立导致每帧归零、卡在首字。
    var totalDur=0;
    for(var k=0;k<demo.length;k++){totalDur+=demo[k].length*CHAR_MS+GAP_MS;}
    if(pos>=totalDur){pos=0;}
    var acc=0,li=0,inLine=0;
    for(var i=0;i<demo.length;i++){
      var dur=demo[i].length*CHAR_MS+GAP_MS;
      if(pos<acc+dur){li=i;inLine=pos-acc;break;}
      acc+=dur;
    }
    var ci=Math.max(0,Math.min(demo[li].length-1,Math.floor(inLine/CHAR_MS)));
    lines.forEach(function(line,i){
      line.classList.toggle('active',i===li);
      if(i!==li)return;
      [].forEach.call(line.children,function(ch,k){
        ch.classList.toggle('sung',k<ci);
        ch.classList.toggle('singing',k===ci);
        if((pvLines.dataset.style==='5'||pvLines.dataset.style==='7'))ch.style.setProperty('--wave',(Math.sin(k*.9)*5).toFixed(1)+'px');
      });
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // —— 星象星点 ——
  var sc=document.getElementById('pvStars'),sx=sc.getContext('2d'),pts=[],starsOn=false;
  function fitStars(){
    var r=preview.getBoundingClientRect();sc.width=r.width;sc.height=r.height;pts=[];
    for(var i=0;i<120;i++)pts.push({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.2+.3,p:Math.random()*6.28});
  }
  function drawStars(t){
    sx.clearRect(0,0,sc.width,sc.height);
    sx.fillStyle='oklch(55% .04 190)';
    pts.forEach(function(s){sx.globalAlpha=.25+.55*(.5+.5*Math.sin(t*.001+s.p));sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.28);sx.fill();});
    sx.globalAlpha=1;
  }
  function startStars(){if(starsOn)return;starsOn=true;fitStars();(function loop(t){drawStars(t);if(preview.dataset.bg==='2')requestAnimationFrame(loop);else starsOn=false;})(performance.now());}
})();
</script>
</body>
</html>
