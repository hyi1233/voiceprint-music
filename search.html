<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="dsh-design" content="desktop">
<title>搜索 · Voiceprint 声纹音乐</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%;overflow:hidden;background:var(--color-base)}
  body{position:relative;height:100%;border-radius:var(--window-radius);overflow:hidden;
    background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased}

  /* —— 布局（与首页同款）—— */
  .layout{position:absolute;inset:0;display:flex;z-index:2}
  .sidebar{width:206px;flex:none;display:flex;flex-direction:column;
    padding:48px 16px 18px;background:oklch(99% 0 0)}
  .side-foot{margin-top:auto;padding:0 8px}
  .side-foot .gh-link{margin-left:auto}
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:0 8px;margin-bottom:40px}
  .brand b{font-size:16px;font-weight:600;letter-spacing:.14em;color:oklch(16% 0 0);white-space:nowrap}
  .brand span{font-size:11px;font-weight:400;letter-spacing:.24em;color:oklch(52% 0 0);white-space:nowrap}
  .nav-label{padding:0 10px;margin:0 0 12px;font-size:11px;font-weight:500;letter-spacing:.24em;color:oklch(53% 0 0)}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav a{display:flex;align-items:center;gap:13px;height:42px;padding:0 12px;border-radius:10px;
    color:oklch(42% 0 0);font-size:16px;text-decoration:none;cursor:pointer;transition:background .2s,color .2s}
  .nav a svg{width:19px;height:19px;flex:none;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .nav a:hover{background:oklch(20% 0 0 / .05);color:oklch(16% 0 0)}
  .nav a.active{color:oklch(16% 0 0);font-weight:600;background:oklch(20% 0 0 / .07)}
  .nav a.active svg{opacity:1;stroke-width:1.9}
  .divider{height:1px;background:var(--color-line);margin:22px 10px}

  .main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--color-bg)}
  .topbar{position:relative;z-index:2;height:64px;flex:none;display:flex;align-items:center;gap:22px;padding:0 30px}
  .chips{display:flex;gap:6px;align-items:center}
  .chip{height:30px;padding:0 15px;border-radius:999px;border:0;background:transparent;color:oklch(50% 0 0);
    font-size:var(--text-xs);letter-spacing:.1em;cursor:pointer;transition:.2s;white-space:nowrap}
  .chip:hover{background:oklch(20% 0 0 / .05);color:oklch(16% 0 0)}
  .chip.on{color:oklch(100% 0 0);background:oklch(16% 0 0)}

  /* —— 搜索内容 —— */
  .content{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;
    padding:16px 40px 92px;overflow-y:auto;scrollbar-width:none}
  .content::-webkit-scrollbar{display:none}
  .wrap{width:100%;max-width:860px;margin:0 auto}

  .search-box{display:flex;align-items:center;gap:16px;height:64px;padding:0 24px;border-radius:18px;
    background:oklch(96.5% 0 0);border:1px solid transparent;transition:background .2s,border .2s,box-shadow .2s}
  .search-box:focus-within{background:oklch(100% 0 0);border-color:oklch(20% 0 0 / .16);box-shadow:var(--shadow-sm)}
  .search-box>svg{width:24px;height:24px;flex:none;stroke:oklch(42% 0 0);stroke-width:1.8;fill:none;stroke-linecap:round}
  .search-box input{flex:1;min-width:0;min-height:30px;border:0;background:transparent;outline:0;font-family:var(--font-sans);
    font-size:var(--text-lg);color:oklch(16% 0 0);letter-spacing:.01em}
  .search-box input::placeholder{color:oklch(62% 0 0)}
  .search-box .clear{width:26px;height:26px;flex:none;border:0;border-radius:50%;cursor:pointer;
    background:oklch(20% 0 0 / .07);color:oklch(45% 0 0);font-size:15px;line-height:1;display:none}
  .search-box.has .clear{display:grid;place-items:center}

  .kicker{display:block;font-size:var(--text-xs);font-weight:600;letter-spacing:.28em;color:oklch(50% 0 0)}
  .block{margin-top:38px}
  .block-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  .block-hd h2{font-size:var(--text-lg);font-weight:600;letter-spacing:.08em;color:oklch(16% 0 0)}
  .block-hd span{font-size:var(--text-xs);letter-spacing:.1em;color:oklch(48% 0 0);cursor:pointer}
  .block-hd span:hover{color:oklch(16% 0 0)}

  /* 热门搜索词 */
  .hot-tags{display:flex;flex-wrap:wrap;gap:12px}
  .hot-tag{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 18px;border-radius:999px;
    border:1px solid oklch(20% 0 0 / .12);background:transparent;color:oklch(30% 0 0);
    font-family:var(--font-sans);font-size:var(--text-sm);letter-spacing:.04em;cursor:pointer;transition:.2s}
  .hot-tag:hover{border-color:oklch(16% 0 0);background:oklch(16% 0 0);color:oklch(100% 0 0)}
  .hot-tag em{font-style:normal;font-size:var(--text-xs);color:oklch(48% 0 0);font-variant-numeric:tabular-nums}
  .hot-tag:hover em{color:oklch(100% 0 0 / .7)}
  .hot-tag.rank b{color:oklch(52% 0 0);font-weight:600;font-size:var(--text-xs)}
  .hot-tag.rank:hover b{color:oklch(100% 0 0 / .8)}

  /* 分类浏览 */
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .cat{position:relative;height:132px;border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;
    background:oklch(20% 0 0);box-shadow:var(--shadow-sm);transition:transform .32s var(--ease),box-shadow .32s var(--ease)}
  .cat:hover{transform:translateY(-5px) scale(1.02);box-shadow:var(--shadow-md)}
  .cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(.46) sepia(.34) saturate(1.06) contrast(1.06);transition:filter .4s var(--ease),transform .5s var(--ease)}
  .cat:hover img{filter:grayscale(.3) sepia(.28) saturate(1.2) contrast(1.06);transform:scale(1.06)}
  .cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,oklch(12% 0 0 / .12) 0%,transparent 28%,oklch(12% 0 0 / .78) 100%)}
  .cat .cname{position:absolute;left:18px;bottom:15px;z-index:1;color:oklch(100% 0 0);font-size:var(--text-md);font-weight:600;letter-spacing:.06em;text-shadow:0 1px 6px oklch(0 0 0 / .4)}
  .cat .csub{position:absolute;left:18px;bottom:40px;z-index:1;color:oklch(100% 0 0 / .96);font-size:var(--text-xs);font-weight:600;letter-spacing:.1em;text-shadow:0 1px 5px oklch(0 0 0 / .55)}

  /* 搜索结果 */
  .results{display:none}
  .results.show{display:block}
  .browse{transition:opacity .2s}
  .results.show ~ .browse{display:none}
  .res-hd{margin:30px 0 12px;font-size:var(--text-xs);letter-spacing:.14em;color:oklch(54% 0 0)}
  .res-hd b{color:oklch(16% 0 0);font-weight:600}
  .song{display:flex;align-items:center;gap:16px;height:66px;padding:0 12px;border-radius:var(--radius-md);
    cursor:pointer;transition:background .18s}
  .song:hover{background:oklch(96.5% 0 0)}
  .song .thumb{width:46px;height:46px;flex:none;border-radius:10px;overflow:hidden;background:oklch(96% 0 0)}
  .song .thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.46) sepia(.34) saturate(1.06) contrast(1.06)}
  .song .meta{flex:1;min-width:0}
  .song .st{font-size:var(--text-sm);font-weight:600;color:oklch(16% 0 0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .song .ss{margin-top:4px;font-size:var(--text-xs);color:oklch(54% 0 0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .song .sd{font-size:var(--text-xs);color:oklch(58% 0 0);font-variant-numeric:tabular-nums}
  .song .play{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
    color:oklch(40% 0 0);opacity:0;transition:opacity .2s}
  .song:hover .play{opacity:1}
  .song .play svg{width:14px;height:14px;fill:currentColor}
  .empty{padding:56px 0;text-align:center;color:oklch(56% 0 0);font-size:var(--text-sm);letter-spacing:.06em}

  .bottom-wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:88px;z-index:3;pointer-events:none;display:block}
  .toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%) translateY(8px);z-index:9;
    padding:10px 20px;border-radius:999px;background:oklch(16% 0 0);color:oklch(100% 0 0);
    font-size:var(--text-xs);letter-spacing:.08em;opacity:0;transition:.28s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

  </svg>

  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><b>Voiceprint</b><span>声纹音乐</span></div>
      <p class="nav-label">浏览</p>
      <nav class="nav">
        <a><svg><use href="#i-discover"/></svg>首页</a>
        <a class="active"><svg><use href="#i-search"/></svg>搜索</a>
        <a><svg><use href="#i-library"/></svg>歌单</a>
        <a><svg><use href="#i-chart"/></svg>排行榜</a>
      </nav>
      <div class="divider"></div>
      <p class="nav-label">我的</p>
      <nav class="nav">
        
        <a><svg><use href="#i-moon"/></svg>沉浸模式</a>
        <a><svg><use href="#i-settings"/></svg>设置</a>
      </nav>
      <div class="side-foot top-brand" title="Voiceprint 声纹音乐">
        <span class="top-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 10v4M21 12h0"/></svg></span>
        <span class="top-brand-name">Voiceprint<span class="v">v1.0.0</span></span>
        <a class="gh-link" href="https://github.com/" target="_blank" rel="noopener noreferrer" title="GitHub 仓库" aria-label="打开 GitHub 仓库">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 012-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </div>

    <section class="main">
      <header class="topbar">
        <div class="chips" id="chips">
          <button class="chip" data-view="首页">首页</button>
          <button class="chip on" data-view="搜索">搜索</button>
          <button class="chip" data-view="歌单">歌单</button>
          <button class="chip" data-view="排行榜">排行榜</button>
          
          <button class="chip" data-view="沉浸模式">沉浸模式</button>
          <button class="chip" data-view="设置">设置</button>
        </div>
      </header>

      <div class="content">
        <div class="wrap">
          <div class="search-box" id="searchBox">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
            <input id="q" type="text" placeholder="搜索歌曲、歌手、专辑…" autocomplete="off" aria-label="搜索">
            <button class="clear" id="clear" aria-label="清空">×</button>
          </div>

          <div class="results" id="results"></div>

          <div class="browse" id="browse">
            <div class="block">
              <div class="block-hd"><h2>热门搜索</h2><span id="refreshHot">换一批 ↻</span></div>
              <div class="hot-tags" id="hotTags"></div>
            </div>
            <div class="block">
              <div class="block-hd"><h2>浏览分类</h2><span>全部 ›</span></div>
              <div class="cat-grid" id="catGrid"></div>

  <canvas class="bottom-wave" id="bottomWave"></canvas>

<script>
(function(){
  // —— 演示数据（实现阶段接真实音源/后台）——
  var songs=[
    {t:'星尘漫游',s:'Olly Murs · PLANET 2021',d:'3:11',img:'cover-focus.jpg'},
    {t:'Birthday Gamble',s:'Jarryd James · After Hours',d:'2:48',img:'cover-card-1.jpg'},
    {t:'Good Together',s:'Claude Kelly · Night Drive',d:'3:36',img:'cover-card-2.jpg'},
    {t:'Art of Affection',s:'Hozier · Soft Focus',d:'4:02',img:'cover-card-3.jpg'},
    {t:'Afterglow',s:'Ed Sheeran · Afterglow',d:'3:47',img:'cover-card-4.jpg'},
    {t:'Quiet Hours',s:'Norah Jones · Blue Hour',d:'3:22',img:'cover-card-2.jpg'},
    {t:'余晖',s:'陈鸿宇 · 晚安',d:'4:15',img:'cover-card-4.jpg'},
    {t:'好时光',s:'朴树 · 清白之年',d:'3:58',img:'cover-card-1.jpg'}
  ];
  var hotA=['星尘漫游','深夜白噪音','民谣精选','失眠电台','冥想音乐','雨天','Afterglow','爵士咖啡'];
  var hotB=['落日飞车','城市夜行','轻音乐','睡眠伴侣','陈鸿宇','lo-fi','海边','好时光'];
  var cats=[
    {n:'流行',s:'POP',img:'cover-card-1.jpg'},
    {n:'民谣',s:'FOLK',img:'cover-card-3.jpg'},
    {n:'爵士',s:'JAZZ',img:'cover-card-2.jpg'},
    {n:'电子',s:'ELECTRONIC',img:'cover-card-4.jpg'},
    {n:'古典',s:'CLASSICAL',img:'ai-photo-scenery-01.jpg'},
    {n:'白噪音',s:'AMBIENT',img:'ai-photo-scenery-03.jpg'}
  ];

  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
  var hotBox=document.getElementById('hotTags'),hotFlip=false;
  function renderHot(){
    hotBox.innerHTML='';
    var arr=hotFlip?hotB:hotA;
    arr.forEach(function(w,i){
      var b=el('button','hot-tag'+(i<3?' rank':''));
      b.innerHTML=(i<3?'<b>0'+(i+1)+'</b>':'')+w+(i<3?'':' <em>'+(9-i)+'万</em>');
      b.addEventListener('click',function(){q.value=w;onSearch();});
      hotBox.appendChild(b);
    });
  }
  renderHot();
  document.getElementById('refreshHot').addEventListener('click',function(){hotFlip=!hotFlip;renderHot();});

  var catGrid=document.getElementById('catGrid');
  cats.forEach(function(c){
    var d=el('div','cat');
    d.innerHTML='<img src="assets/'+c.img+'" alt="'+c.n+'"><span class="csub">'+c.s+'</span><span class="cname">'+c.n+'</span>';
    d.addEventListener('click',function(){showToast('「'+c.n+'」分类制作中');});
    catGrid.appendChild(d);
  });

  // —— 搜索（演示级即时过滤）——
  var q=document.getElementById('q'),box=document.getElementById('searchBox'),
      results=document.getElementById('results'),browse=document.getElementById('browse'),
      clear=document.getElementById('clear');
  function onSearch(){
    var kw=q.value.trim().toLowerCase();
    box.classList.toggle('has',!!kw);
    results.classList.toggle('show',!!kw);
    browse.style.opacity=kw?'0':'1';
    if(!kw){results.innerHTML='';return;}
    var hit=songs.filter(function(s){return (s.t+s.s).toLowerCase().indexOf(kw)>-1;});
    var html='<div class="res-hd">搜索「<b>'+escapeHtml(q.value.trim())+'</b>」 · 找到 '+hit.length+' 首</div>';
    if(!hit.length){html+='<div class="empty">没有找到相关内容，换个词试试</div>';}
    hit.forEach(function(s){
      html+='<div class="song" data-title="'+escapeHtml(s.t)+'"><div class="thumb"><img src="assets/'+s.img+'" alt=""></div>'+
        '<div class="meta"><div class="st">'+escapeHtml(s.t)+'</div><div class="ss">'+escapeHtml(s.s)+'</div></div>'+
        '<span class="sd">'+s.d+'</span><span class="play"><svg><use href="#i-play"/></svg></span></div>';
    });
    results.innerHTML=html;
    [].slice.call(results.querySelectorAll('.song')).forEach(function(row){
      row.addEventListener('click',function(){location.href='player.html';});
    });
  }
  function escapeHtml(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  q.addEventListener('input',onSearch);
  q.addEventListener('keydown',function(e){if(e.key==='Escape'){q.value='';onSearch();q.blur();}});
  clear.addEventListener('click',function(){q.value='';onSearch();q.focus();});
  function showToast(t){var tst=document.getElementById('toast');tst.textContent=t;tst.classList.add('show');
    clearTimeout(showToast._t);showToast._t=setTimeout(function(){tst.classList.remove('show');},1600);}

  // —— 顶栏分类与左侧菜单双向联动（与首页同款）——
  var chipEls=[].slice.call(document.querySelectorAll('.chip')),
      navEls=[].slice.call(document.querySelectorAll('.nav a'));
  function setView(label){
    chipEls.forEach(function(c){c.classList.toggle('on',c.dataset.view===label);});
    navEls.forEach(function(n){n.classList.toggle('active',n.textContent.trim()===label);});
    var url={'首页':'home.html','搜索':'search.html','歌单':'playlist.html','排行榜':'rank.html','沉浸模式':'immersive.html','设置':'settings.html'}[label];
    if(url){location.href=url;}
  }
  function navToast(msg){
    var t=document.getElementById('navToast');
    if(!t){t=document.createElement('div');t.id='navToast';
      t.style.cssText='position:fixed;left:50%;bottom:34px;transform:translate(-50%,0);z-index:99;padding:10px 20px;border-radius:999px;background:rgba(30,30,30,.92);color:#fff;font-size:13px;opacity:0;transition:opacity .25s';
      document.body.appendChild(t);}
    t.textContent=msg;t.style.opacity='1';
    clearTimeout(t._timer);t._timer=setTimeout(function(){t.style.opacity='0';},1500);
  }
  chipEls.forEach(function(c){c.addEventListener('click',function(){setView(c.dataset.view);});});
  navEls.forEach(function(n){n.addEventListener('click',function(){setView(n.textContent.trim());});});

  // —— 底部冷灰声纹（与首页同款，铺满主内容区）——
  var BPM=84,beatMs=60000/BPM;
  function fit(cv){var dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;
    cv.width=w*dpr;cv.height=h*dpr;cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);return {w:w,h:h};}
  function pickColor(){var r=Math.random();
    if(r<0.10)return{h:6,s:64,l:54};if(r<0.18)return{h:212,s:58,l:56};
    if(r<0.24)return{h:32,s:60,l:55};return{h:230,s:0,l:44};}
  var bw=document.getElementById('bottomWave'),bx=bw.getContext('2d'),W,BN=140,pts=[];
  for(var j=0;j<BN;j++)pts.push({ph:Math.random()*6.28,sp:.4+Math.random()*.8,y:Math.random()*2-1,c:pickColor()});
  function resize(){W=fit(bw);}
  addEventListener('resize',resize);resize();
  function drawWave(t){
    bx.clearRect(0,0,W.w,W.h);
    var sideW=206,avail=W.w-sideW,span=avail,x0=sideW,base=W.h*.62;
    for(var i=0;i<BN;i++){
      var p=pts[i],x=x0+span*i/(BN-1),env=Math.sin(Math.PI*i/(BN-1));
      var breathe=.8+.2*Math.sin(t*.0005+p.ph*.3);
      var beatPhase=(((t-(i%6)*26)%beatMs)+beatMs)%beatMs/beatMs;
      var kick=Math.pow(1-beatPhase,2.2);
      var a=Math.sin(i*.30+p.ph+t*.0009*p.sp)*Math.sin(i*.09-t*.0006+p.ph);
      var envelope=Math.sin(i*.17-t*.0012)*Math.sin(i*.045+t*.0004);
      var amp=env*breathe*(8+11*Math.abs(a)*(.4+1.2*kick));
      var yy=base+envelope*amp+p.y*amp*.12,hh=2+Math.abs(a)*9*env*(.5+1.1*kick),col=p.c;
      var al=Math.min(.68,.12+.26*env*breathe*(.5+.6*kick)+.08*Math.abs(a)+(col.s?.22:0));
      bx.strokeStyle='hsla('+col.h+','+col.s+'%,'+col.l+'%,'+al+')';bx.lineWidth=1;bx.lineCap='round';
      bx.beginPath();bx.moveTo(x,yy-hh);bx.lineTo(x,yy+hh);bx.stroke();
      bx.fillStyle='hsla('+col.h+','+col.s+'%,'+(col.l-4)+'%,'+(al*.9)+')';
      bx.beginPath();bx.arc(x,yy,1+Math.abs(a)*1.4,0,6.28);bx.fill();
    }
  }
  function frame(t){drawWave(t);requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
})();
</script>
