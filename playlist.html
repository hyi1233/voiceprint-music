<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="dsh-design" content="desktop">
<title>歌单 · Voiceprint 声纹音乐</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%;overflow:hidden;background:var(--color-base)}
  body{position:relative;height:100%;border-radius:var(--window-radius);overflow:hidden;
    background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased}

  /* —— 布局（与首页/搜索同款）—— */
  .layout{position:absolute;inset:0;display:flex;z-index:2}
  .sidebar{width:206px;flex:none;display:flex;flex-direction:column;
    padding:48px 16px 18px;background:oklch(99% 0 0)}
  .side-foot{margin-top:auto;padding:0 8px}
  .side-foot .gh-link{margin-left:auto}
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:0 8px;margin-bottom:40px}
  .brand b{font-size:16px;font-weight:600;letter-spacing:.14em;color:oklch(16% 0 0);white-space:nowrap}
  .brand span{font-size:11px;font-weight:400;letter-spacing:.24em;color:oklch(52% 0 0);white-space:nowrap}
  .nav-label{padding:0 10px;margin:0 0 12px;font-size:11px;font-weight:500;letter-spacing:.24em;color:oklch(53% 0 0)}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav a{display:flex;align-items:center;gap:13px;height:42px;padding:0 12px;border-radius:10px;
    color:oklch(42% 0 0);font-size:16px;text-decoration:none;cursor:pointer;transition:background .2s,color .2s}
  .nav a svg{width:19px;height:19px;flex:none;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .nav a:hover{background:oklch(20% 0 0 / .05);color:oklch(16% 0 0)}
  .nav a.active{color:oklch(16% 0 0);font-weight:600;background:oklch(20% 0 0 / .07)}
  .nav a.active svg{opacity:1;stroke-width:1.9}
  .divider{height:1px;background:var(--color-line);margin:22px 10px}

  .main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--color-bg)}
  .topbar{position:relative;z-index:2;height:64px;flex:none;display:flex;align-items:center;gap:22px;padding:0 30px}
  .chips{display:flex;gap:6px;align-items:center}
  .chip{height:30px;padding:0 15px;border-radius:999px;border:0;background:transparent;color:oklch(50% 0 0);
    font-size:var(--text-xs);letter-spacing:.1em;cursor:pointer;transition:.2s;white-space:nowrap}
  .chip:hover{background:oklch(20% 0 0 / .05);color:oklch(16% 0 0)}
  .chip.on{color:oklch(100% 0 0);background:oklch(16% 0 0)}

  /* —— 内容区（可滚动，两大部分）—— */
  .content{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;
    padding:22px 40px 116px}
  .content::-webkit-scrollbar{display:none}
  .wrap{width:100%;max-width:920px;margin:0 auto}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
  .page-head .kicker{display:block;font-size:var(--text-xs);font-weight:600;letter-spacing:.28em;color:oklch(50% 0 0);margin-bottom:8px}
  .page-head h1{font-size:var(--text-3xl);font-weight:600;letter-spacing:.04em;color:oklch(16% 0 0)}
  .page-head .hint{margin-top:8px;font-size:var(--text-xs);letter-spacing:.08em;color:oklch(54% 0 0)}
  .new-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px;border-radius:999px;
    border:1px solid oklch(20% 0 0 / .16);background:transparent;color:oklch(16% 0 0);
    font-family:var(--font-sans);font-size:var(--text-sm);letter-spacing:.04em;cursor:pointer;transition:.2s}
  .new-btn:hover{background:oklch(16% 0 0);border-color:oklch(16% 0 0);color:oklch(100% 0 0)}
  .new-btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round}

  .section{margin-bottom:30px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sec-head h2{display:flex;align-items:center;gap:10px;font-size:var(--text-xl);font-weight:600;
    letter-spacing:.03em;color:oklch(16% 0 0)}
  .sec-head h2 .bar{width:3px;height:18px;border-radius:2px;background:oklch(16% 0 0)}
  .sec-head .sub{font-size:var(--text-xs);letter-spacing:.1em;color:oklch(54% 0 0);margin-left:4px}
  .tabs{display:flex;gap:8px}
  .tab{height:28px;padding:0 14px;border-radius:999px;font-size:var(--text-xs);letter-spacing:.06em;
    color:oklch(52% 0 0);cursor:pointer;transition:.2s;border:1px solid transparent}
  .tab:hover{color:oklch(16% 0 0)}
  .tab.on{color:oklch(100% 0 0);background:oklch(16% 0 0)}
  .more{font-size:var(--text-xs);letter-spacing:.08em;color:oklch(52% 0 0);cursor:pointer;transition:.2s}
  .more:hover{color:oklch(16% 0 0)}

  .hscroll{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
  .hscroll::-webkit-scrollbar{display:none}

  /* 个人方形歌单卡 */
  .pcard{width:150px;flex:none;scroll-snap-align:start;cursor:pointer}
  .pcard .cover{position:relative;border-radius:var(--radius-md);overflow:hidden;aspect-ratio:1/1;
    background:oklch(20% 0 0);box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
  .pcard:hover .cover{transform:translateY(-5px) scale(1.03);box-shadow:var(--shadow-md)}
  .pcard .cover img{width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(.46) sepia(.34) saturate(1.06) contrast(1.06);transition:filter .4s var(--ease)}
  .pcard:hover .cover img{filter:grayscale(.38) sepia(.3) saturate(1.16) contrast(1.08)}
  .pcard .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,oklch(12% 0 0 / .6) 100%)}
  .pcard .count{position:absolute;left:11px;bottom:10px;z-index:1;color:oklch(100% 0 0 / .94);
    font-size:var(--text-xs);text-shadow:0 1px 5px oklch(0 0 0 / .5)}
  .pcard .play-dot{position:absolute;right:10px;bottom:10px;z-index:1;width:30px;height:30px;border-radius:50%;
    display:grid;place-items:center;background:oklch(100% 0 0);color:oklch(16% 0 0);
    opacity:0;transform:translateY(5px);transition:opacity .25s,transform .25s}
  .pcard:hover .play-dot{opacity:1;transform:none}
  .pcard .play-dot svg{width:12px;height:12px;fill:currentColor;margin-left:2px}
  .pcard .pt{margin-top:10px;font-size:var(--text-sm);font-weight:600;color:oklch(16% 0 0);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcard .pd{margin-top:3px;font-size:var(--text-xs);color:oklch(54% 0 0);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .pcard.create .cover{display:grid;place-items:center;border:1.5px dashed oklch(20% 0 0 / .24);
    background:transparent;box-shadow:none}
  .pcard.create .cover::after{display:none}
  .pcard.create:hover .cover{border-color:oklch(16% 0 0);background:oklch(96.5% 0 0);transform:none;box-shadow:none}
  .pcard.create .plus{display:flex;flex-direction:column;align-items:center;gap:8px;color:oklch(52% 0 0)}
  .pcard.create:hover .plus{color:oklch(16% 0 0)}
  .pcard.create .plus svg{width:28px;height:28px;stroke:currentColor;stroke-width:1.4;fill:none;stroke-linecap:round}
  .pcard.create .plus span{font-size:var(--text-xs);letter-spacing:.06em}

  /* 发现歌单长卡（带来源角标） */
  .dcard{width:262px;flex:none;scroll-snap-align:start;display:flex;gap:13px;padding:10px;
    border-radius:var(--radius-md);border:1px solid var(--color-line);background:oklch(100% 0 0);
    cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s}
  .dcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:oklch(20% 0 0 / .2)}
  .dcard .thumb{position:relative;width:88px;height:88px;flex:none;border-radius:10px;overflow:hidden;background:oklch(20% 0 0)}
  .dcard .thumb img{width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(.46) sepia(.34) saturate(1.06) contrast(1.06)}
  .dcard .src{position:absolute;left:0;top:0;z-index:1;padding:3px 7px;border-radius:0 0 8px 0;
    background:oklch(20% 0 0);color:oklch(100% 0 0);font-size:11px;letter-spacing:.02em}
  .dcard .info{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .dcard .info h4{font-size:var(--text-sm);font-weight:600;color:oklch(16% 0 0);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dcard .info p{font-size:var(--text-xs);line-height:1.5;color:oklch(52% 0 0);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dcard .info .tag{font-size:11px;letter-spacing:.04em;color:oklch(50% 0 0)}

  /* 电台卡 */
  .rcard{width:216px;flex:none;scroll-snap-align:start;padding:14px;border-radius:var(--radius-md);
    border:1px solid var(--color-line);background:oklch(100% 0 0);cursor:pointer;
    transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s}
  .rcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:oklch(20% 0 0 / .2)}
  .rcard .rh{display:flex;align-items:center;gap:9px}
  .rcard .ricon{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
    background:oklch(16% 0 0);color:oklch(100% 0 0)}
  .rcard .ricon svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .rcard .rh h4{font-size:var(--text-sm);font-weight:600;color:oklch(16% 0 0)}
  .rcard .rh .live{font-size:11px;letter-spacing:.04em;color:oklch(50% 0 0)}
  .rcard p{margin-top:10px;font-size:var(--text-xs);line-height:1.5;color:oklch(52% 0 0);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rcard .rbar{display:flex;align-items:center;gap:3px;height:16px;margin-top:6px}
  .rcard .rbar i{width:2px;border-radius:2px;background:oklch(60% 0 0);display:block}

  .bottom-wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:88px;z-index:3;pointer-events:none;display:block}
  .toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%) translateY(8px);z-index:9;
    padding:10px 20px;border-radius:999px;background:oklch(16% 0 0);color:oklch(100% 0 0);
    font-size:var(--text-xs);letter-spacing:.08em;opacity:0;transition:.28s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-discover" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 5v14M8 5v14M12 6l7-1.6v13.2L12 16"/><circle cx="5.5" cy="9" r="1"/><circle cx="5.5" cy="15" r="1"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1-2.1 2.1-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21h-3v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1L6.8 17l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H5v-3h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8L6.8 7.1 8.9 5l.1.1a1.6 1.6 0 001.8.3 1.6 1.6 0 001-1.5V4h3v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1 2.1 2.1-.1.1a1.6 1.6 0 00-.3 1.8 1.6 1.6 0 001.5 1H21v3h-.1a1.6 1.6 0 00-1.5 1z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-radio" viewBox="0 0 24 24"><path d="M3 10h18M5 10l14-5M4 10v9a1 1 0 001 1h14a1 1 0 001-1v-9"/><circle cx="8" cy="15" r="2"/><path d="M13 14h5M13 17h3"/></symbol>
  </svg>

  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><b>Voiceprint</b><span>声纹音乐</span></div>
      <p class="nav-label">浏览</p>
      <nav class="nav">
        <a><svg><use href="#i-discover"/></svg>首页</a>
        <a><svg><use href="#i-search"/></svg>搜索</a>
        <a class="active"><svg><use href="#i-library"/></svg>歌单</a>
        <a><svg><use href="#i-chart"/></svg>排行榜</a>
      </nav>
      <div class="divider"></div>
      <p class="nav-label">我的</p>
      <nav class="nav">
        
        <a><svg><use href="#i-moon"/></svg>沉浸模式</a>
        <a><svg><use href="#i-settings"/></svg>设置</a>
      </nav>
      <div class="side-foot top-brand" title="Voiceprint 声纹音乐">
        <span class="top-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 10v4M21 12h0"/></svg></span>
        <span class="top-brand-name">Voiceprint<span class="v">v1.0.0</span></span>
        <a class="gh-link" href="https://github.com/" target="_blank" rel="noopener noreferrer" title="GitHub 仓库" aria-label="打开 GitHub 仓库">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 012-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div class="chips" id="chips">
          <button class="chip" data-view="首页">首页</button>
          <button class="chip" data-view="搜索">搜索</button>
          <button class="chip on" data-view="歌单">歌单</button>
          <button class="chip" data-view="排行榜">排行榜</button>
          
          <button class="chip" data-view="沉浸模式">沉浸模式</button>
          <button class="chip" data-view="设置">设置</button>
        </div>
      </header>

      <div class="content">
        <div class="wrap">
          <div class="page-head">
            <div>
              <span class="kicker">COLLECTIONS</span>
              <h1>歌单与电台</h1>
              <div class="hint">你创建的、收藏的，和音源为你发现的</div>
            </div>
            <button class="new-btn" id="newBtn"><svg><use href="#i-plus"/></svg>新建歌单</button>
          </div>

          <!-- 我的歌单 -->
          <section class="section">
            <div class="sec-head">
              <h2><span class="bar"></span>我的歌单<span class="sub">LOCAL</span></h2>
              <div class="tabs" id="tabs">
                <span class="tab on" data-tab="made">我创建的</span>
                <span class="tab" data-tab="fav">我收藏的</span>
                <span class="tab" data-tab="recent">最近播放</span>
              </div>
            </div>
            <div class="hscroll" id="mineRow"></div>
          </section>

          <!-- 发现歌单 -->
          <section class="section">
            <div class="sec-head">
              <h2><span class="bar"></span>发现歌单<span class="sub">来自你的音源</span></h2>
              <span class="more" id="moreSource">查看全部 ›</span>
            </div>
            <div class="hscroll" id="discoverRow"></div>
          </section>

          <!-- 电台 · 播客 -->
          <section class="section">
            <div class="sec-head">
              <h2><span class="bar"></span>电台 · 播客<span class="sub">RADIO</span></h2>
              <span class="more" id="moreRadio">更多电台 ›</span>
            </div>
            <div class="hscroll" id="radioRow"></div>
          </section>
        </div>
      </div>
    </section>
  </div>

  <canvas class="bottom-wave" id="bottomWave"></canvas>
  <div class="toast" id="toast">制作中</div>

<script>
(function(){
  // —— 演示数据（实现阶段接真实音源/本地存储）——
  var mine={
    made:[
      {t:'深夜漫游',d:'32 首',img:'cover-focus.jpg'},
      {t:'通勤路上',d:'24 首',img:'cover-card-1.jpg'},
      {t:'雨天书房',d:'18 首',img:'cover-card-2.jpg'},
      {t:'清晨咖啡',d:'15 首',img:'cover-card-3.jpg'}
    ],
    fav:[
      {t:'睡前白噪音',d:'40 首',img:'ai-photo-scenery-01.jpg'},
      {t:'民谣精选',d:'27 首',img:'cover-card-3.jpg'},
      {t:'落日飞车',d:'15 首',img:'cover-card-4.jpg'}
    ],
    recent:[
      {t:'好时光',d:'21 首',img:'cover-card-1.jpg'},
      {t:'爵士咖啡',d:'30 首',img:'cover-card-2.jpg'},
      {t:'海边',d:'12 首',img:'ai-photo-scenery-03.jpg'}
    ]
  };
  var discover=[
    {t:'抖音流行热歌精选',src:'企鹅音乐',tag:'官方歌单',desc:'全网都在找的旋律，持续更新',img:'cover-card-1.jpg'},
    {t:'90后必备·青春回忆',src:'拾云音乐',tag:'音源推荐',desc:'这些歌，承包了我们的整个青春',img:'cover-card-2.jpg'},
    {t:'深夜 EMO 独处时刻',src:'萌狗音乐',tag:'为你推荐',desc:'一个人的夜里，让旋律陪着你',img:'cover-card-3.jpg'},
    {t:'私人雷达·每日 30 首',src:'Voiceprint',tag:'私人雷达',desc:'根据你的聆听习惯智能生成',img:'cover-card-4.jpg'}
  ];
  var radios=[
    {t:'深夜电台',live:'每周五更新',desc:'聊聊音乐，也聊聊那些睡不着夜里心事的人。',h:8},
    {t:'白噪音研究所',live:'直播中',desc:'雨声、海浪、篝火——专注与入眠的声音背景。',h:5},
    {t:'城市漫游 FM',live:'每日更新',desc:'用一座城的声音，做一段流动的旅行日记。',h:11}
  ];

  var mineRow=document.getElementById('mineRow'),tab='made';
  function renderMine(){
    mineRow.innerHTML='';
    var c=document.createElement('div');c.className='pcard create';
    c.innerHTML='<div class="cover"><div class="plus"><svg><use href="#i-plus"/></svg><span>新建歌单</span></div></div>';
    c.addEventListener('click',function(){showToast('新建歌单');});
    mineRow.appendChild(c);
    mine[tab].forEach(function(p){
      var card=document.createElement('div');card.className='pcard';
      card.innerHTML='<div class="cover"><img src="assets/'+p.img+'" alt="'+p.t+'">'+
        '<span class="count">'+p.d+'</span>'+
        '<span class="play-dot"><svg><use href="#i-play"/></svg></span></div>'+
        '<div class="pt">'+p.t+'</div><div class="pd">'+p.d+'</div>';
      card.addEventListener('click',function(){location.href='player.html';});
      mineRow.appendChild(card);
    });
  }
  renderMine();

  var discoverRow=document.getElementById('discoverRow');
  discover.forEach(function(p){
    var card=document.createElement('div');card.className='dcard';
    card.innerHTML='<div class="thumb"><img src="assets/'+p.img+'" alt="'+p.t+'"><span class="src">'+p.src+'</span></div>'+
      '<div class="info"><span class="tag">'+p.tag+'</span><h4>'+p.t+'</h4><p>'+p.desc+'</p></div>';
    card.addEventListener('click',function(){location.href='player.html';});
    discoverRow.appendChild(card);
  });

  var radioRow=document.getElementById('radioRow');
  radios.forEach(function(r){
    var card=document.createElement('div');card.className='rcard';
    var bars='';for(var i=0;i<18;i++){var h=3+Math.abs(Math.sin(i*.9+r.h))*11;bars+='<i style="height:'+h.toFixed(0)+'px"></i>';}
    card.innerHTML='<div class="rh"><span class="ricon"><svg><use href="#i-radio"/></svg></span>'+
      '<div><h4>'+r.t+'</h4><div class="live">'+r.live+'</div></div></div>'+
      '<p>'+r.desc+'</p><div class="rbar">'+bars+'</div>';
    card.addEventListener('click',function(){location.href='player.html';});
    radioRow.appendChild(card);
  });

  // 筛选标签
  [].slice.call(document.querySelectorAll('.tab')).forEach(function(t){
    t.addEventListener('click',function(){
      [].slice.call(document.querySelectorAll('.tab')).forEach(function(x){x.classList.remove('on');});
      t.classList.add('on');tab=t.dataset.tab;renderMine();
    });
  });
  document.getElementById('newBtn').addEventListener('click',function(){showToast('新建歌单');});
  document.getElementById('moreSource').addEventListener('click',function(){location.href='discover.html';});
  document.getElementById('moreRadio').addEventListener('click',function(){location.href='radio.html';});

  function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
    clearTimeout(showToast._t);showToast._t=setTimeout(function(){el.classList.remove('show');},1600);}

  // —— 顶栏分类与左侧菜单双向联动（与首页/搜索同款）——
  var chipEls=[].slice.call(document.querySelectorAll('.chip')),
      navEls=[].slice.call(document.querySelectorAll('.nav a'));
  function setView(label){
    chipEls.forEach(function(c){c.classList.toggle('on',c.dataset.view===label);});
    navEls.forEach(function(n){n.classList.toggle('active',n.textContent.trim()===label);});
    var url={'首页':'home.html','搜索':'search.html','歌单':'playlist.html','排行榜':'rank.html','沉浸模式':'immersive.html','设置':'settings.html'}[label];
    if(url){location.href=url;}
  }
  function navToast(msg){
    var t=document.getElementById('navToast');
    if(!t){t=document.createElement('div');t.id='navToast';
      t.style.cssText='position:fixed;left:50%;bottom:34px;transform:translate(-50%,0);z-index:99;padding:10px 20px;border-radius:999px;background:rgba(30,30,30,.92);color:#fff;font-size:13px;opacity:0;transition:opacity .25s';
      document.body.appendChild(t);}
    t.textContent=msg;t.style.opacity='1';
    clearTimeout(t._timer);t._timer=setTimeout(function(){t.style.opacity='0';},1500);
  }
  chipEls.forEach(function(c){c.addEventListener('click',function(){setView(c.dataset.view);});});
  navEls.forEach(function(n){n.addEventListener('click',function(){setView(n.textContent.trim());});});

  // —— 底部冷灰声纹（与首页/搜索同款，铺满主内容区）——
  var BPM=84,beatMs=60000/BPM;
  function fit(cv){var dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;
    cv.width=w*dpr;cv.height=h*dpr;cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);return {w:w,h:h};}
  function pickColor(){var r=Math.random();
    if(r<0.10)return{h:6,s:64,l:54};if(r<0.18)return{h:212,s:58,l:56};
    if(r<0.24)return{h:32,s:60,l:55};return{h:230,s:0,l:44};}
  var bw=document.getElementById('bottomWave'),bx=bw.getContext('2d'),W,BN=140,pts=[];
  for(var j=0;j<BN;j++)pts.push({ph:Math.random()*6.28,sp:.4+Math.random()*.8,y:Math.random()*2-1,c:pickColor()});
  function resize(){W=fit(bw);}
  addEventListener('resize',resize);resize();
  function drawWave(t){
    bx.clearRect(0,0,W.w,W.h);
    var sideW=206,avail=W.w-sideW,span=avail,x0=sideW,base=W.h*.62;
    for(var i=0;i<BN;i++){
      var p=pts[i],x=x0+span*i/(BN-1),env=Math.sin(Math.PI*i/(BN-1));
      var breathe=.8+.2*Math.sin(t*.0005+p.ph*.3);
      var beatPhase=(((t-(i%6)*26)%beatMs)+beatMs)%beatMs/beatMs;
      var kick=Math.pow(1-beatPhase,2.2);
      var a=Math.sin(i*.30+p.ph+t*.0009*p.sp)*Math.sin(i*.09-t*.0006+p.ph);
      var envelope=Math.sin(i*.17-t*.0012)*Math.sin(i*.045+t*.0004);
      var amp=env*breathe*(8+11*Math.abs(a)*(.4+1.2*kick));
      var yy=base+envelope*amp+p.y*amp*.12,hh=2+Math.abs(a)*9*env*(.5+1.1*kick),col=p.c;
      var al=Math.min(.68,.12+.26*env*breathe*(.5+.6*kick)+.08*Math.abs(a)+(col.s ? .22 : 0));
      bx.strokeStyle='hsla('+col.h+','+col.s+'%,'+col.l+'%,'+al+')';bx.lineWidth=1;bx.lineCap='round';
      bx.beginPath();bx.moveTo(x,yy-hh);bx.lineTo(x,yy+hh);bx.stroke();
      bx.fillStyle='hsla('+col.h+','+col.s+'%,'+(col.l-4)+'%,'+(al*.9)+')';
      bx.beginPath();bx.arc(x,yy,1+Math.abs(a)*1.4,0,6.28);bx.fill();
    }
  }
  function frame(t){drawWave(t);requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
