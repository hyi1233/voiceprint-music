<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="dsh-design" content="desktop">
<title>正在播放 · Voiceprint 声纹音乐</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%;overflow:hidden;background:var(--color-base)}
  body{position:relative;height:100%;border-radius:var(--window-radius);overflow:hidden;
    background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased}

  .player{position:absolute;inset:0;display:flex;flex-direction:column;z-index:2}

  /* —— 顶栏：与首页同款菜单栏，可点击跳转；右上角声纹 logo + 名字/版本（logo 占位待设计）—— */
  .topbar{position:relative;height:66px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 30px 0 84px;border-bottom:1px solid var(--color-line)}   /* 左留白避开红绿灯 */
  .chips{display:flex;gap:6px;align-items:center}
  .chip{height:32px;padding:0 15px;border-radius:999px;border:0;
    background:transparent;color:oklch(50% 0 0);font-size:var(--text-xs);
    letter-spacing:.1em;cursor:pointer;transition:.2s;white-space:nowrap}
  .chip:hover{background:oklch(20% 0 0 / .05);color:oklch(16% 0 0)}
  .chip:focus-visible{outline:2px solid oklch(40% 0 0);outline-offset:2px}
  .chip.on{color:oklch(100% 0 0);background:oklch(16% 0 0)}
  /* .top-brand 系列在 tokens.css 统一定义，四页共用，保证右上角 logo 完全齐平 */

  /* —— 舞台：左封面 + 右歌词 —— */
  .stage{flex:1;min-height:0;display:flex;align-items:center;gap:76px;padding:26px 72px 10px}

  .left{width:360px;flex:none;display:flex;flex-direction:column;align-items:center}
  .cover{width:340px;height:340px;border-radius:var(--radius-xl);overflow:hidden;
    background:oklch(96% 0 0);box-shadow:var(--shadow-md)}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(.46) sepia(.34) saturate(1.06) contrast(1.06)}
  .track{margin-top:30px;text-align:center;width:100%}
  .track .cn{font-size:clamp(30px,3vw,42px);font-weight:720;letter-spacing:-.02em;color:oklch(14% 0 0)}
  .track .en{margin-top:8px;font-size:13px;font-weight:400;letter-spacing:.2em;color:oklch(52% 0 0)}
  .track .artist{margin-top:16px;font-size:var(--text-sm);letter-spacing:.04em;color:oklch(48% 0 0)}

  /* 歌词区：重点，占据原声纹的主舞台；为将来逐字特效预留结构 */
  .right{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;
    align-items:center;padding-left:56px}          /* 拉开与封面距离，整体在右半框居中 */
  .lyrics{display:flex;flex-direction:column;gap:22px;align-items:center}
  .lyrics .line{font-size:20px;line-height:1.5;letter-spacing:.04em;color:oklch(52% 0 0);
    text-align:center;transition:color .4s,font-size .4s,font-weight .4s;cursor:pointer;user-select:none}
  .lyrics .line.active{font-size:clamp(26px,2.6vw,36px);font-weight:680;letter-spacing:-.01em;
    color:oklch(12% 0 0)}
  /* 逐字单元：inline-block 才能承载 transform/opacity 等逐字动画
     将来做逐字点亮/粒子爆发/掉落/黑洞吸字/白洞吐字/离子态，直接给 .ch 加 keyframes 与 animation-delay 即可 */
  .lyrics .line .ch{display:inline-block;white-space:pre;
    transition:color .3s,transform .3s,text-shadow .3s}

  /* —— 统一动态歌词引擎：非全屏 .lyrics 与全屏 .fs-lines 共用同一套逐字状态与 6 种样式 —— */
  .lyrics{--la:oklch(52% .14 55);--lg:0 0 14px oklch(80% .16 70 / .55)}      /* 白底暖金（偏深才看得清） */
  .fs-lines{--la:oklch(88% .09 82);--lg:0 0 20px oklch(86% .15 74 / .9),0 0 46px oklch(80% .17 64 / .55)} /* 暗底暖金 */
  .line.active .ch.sung{color:var(--la)}
  .line.active .ch.singing{color:var(--la);transform:translateY(-6px) scale(1.14);text-shadow:var(--lg)}
  /* 样式 1 流光扫描：当前字光带扫过 */
  [data-style="1"] .line.active .ch.singing{animation:sweep 1s ease-out}
  @keyframes sweep{0%{text-shadow:-14px 0 10px var(--la);opacity:.55}100%{text-shadow:var(--lg);opacity:1}}
  /* 样式 2 云阶淡入：字句如云浮现 */
  [data-style="2"] .line.active .ch.sung{animation:cloudIn .6s ease-out both}
  @keyframes cloudIn{from{opacity:0;transform:translateY(12px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
  /* 样式 3 粒子爆发：当前字多色闪爆 */
  [data-style="3"] .line.active .ch.singing{animation:burst .55s ease-out both}
  @keyframes burst{
    0%{text-shadow:0 0 0 2px oklch(70% .2 30),0 0 0 2px oklch(70% .2 210);transform:scale(1)}
    45%{text-shadow:6px -6px 12px oklch(70% .2 30),-6px 6px 12px oklch(70% .2 210),0 0 20px var(--la);transform:scale(1.3)}
    100%{text-shadow:var(--lg);transform:scale(1.14)}}
  /* 样式 4 呼吸缩放：当前字随节拍呼吸 */
  [data-style="4"] .line.active .ch.singing{animation:breathe 1.15s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.32) translateY(-5px)}}
  /* 样式 5 波浪跳动：已唱字错落起伏（--wave 由 JS 按字序写入） */
  [data-style="5"] .line.active .ch.sung{transform:translateY(var(--wave,0));color:var(--la)}
  [data-style="5"] .line.active .ch.singing{transform:translateY(var(--wave,0)) scale(1.2)}
  /* 样式 6 心象（cadenza）：当前字呼吸浮动+轻微旋转 */
  [data-style="6"] .line.active .ch.singing{animation:cadenza 1.4s ease-in-out infinite}
  @keyframes cadenza{0%,100%{transform:translateY(0) rotate(0) scale(1.1)}
    50%{transform:translateY(-8px) rotate(4deg) scale(1.22)}}
  /* 样式 7 云阶·语义排列（partita）：已唱字错位、当前字上浮留白 */
  [data-style="7"] .line.active .ch.sung{transform:translateY(var(--wave,0));opacity:.85}
  [data-style="7"] .line.active .ch.singing{transform:translateY(-14px) scale(1.16);letter-spacing:.18em}
  /* 样式 8 浮名（fume）：当前字景深发光+放大，如被光打亮 */
  [data-style="8"] .line.active .ch.singing{animation:fume 1.6s ease-out both}
  @keyframes fume{0%{filter:blur(4px);transform:scale(.9);opacity:.4}
    60%{filter:blur(0);transform:scale(1.3);text-shadow:var(--lg)}100%{transform:scale(1.16)}}
  /* 样式 9 时计（pendolo）：当前字如钟摆左右摆动 */
  [data-style="9"] .line.active .ch.singing{animation:pendolo 1.1s ease-in-out infinite;transform-origin:top center}
  @keyframes pendolo{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  /* 样式 10 凝彩·胶片滤镜（sonnet 风）：当前句整体轻微色差抖动 */
  [data-style="10"] .line.active{animation:glitch 2.4s steps(1) infinite}
  @keyframes glitch{0%,92%,100%{text-shadow:none;transform:none}
    94%{text-shadow:-2px 0 var(--la),2px 0 oklch(70% .18 210);transform:translateX(1px)}
    96%{text-shadow:2px 0 var(--la),-2px 0 oklch(70% .18 30);transform:translateX(-1px)}}

  /* 倍数键：直接显示当前倍速文字 */
  .ctrl.speed{width:auto;min-width:44px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:650;
    letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .fs-dock .ctrl.speed{color:oklch(88% .09 82)}

  /* —— 动态歌词样式选择面板 —— */
  .style-mask{position:absolute;inset:0;z-index:21;background:oklch(16% 0 0 / .18);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .style-mask.open{opacity:1;pointer-events:auto}
  .style-panel{position:absolute;left:0;top:0;z-index:22;width:340px;padding:22px 22px 18px;
    background:oklch(100% 0 0);border:1px solid var(--color-line);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);opacity:0;transform:scale(.98);transform-origin:top right;
    pointer-events:none;transition:opacity .2s,transform .2s var(--ease)}
  .style-panel.open{opacity:1;transform:none;pointer-events:auto}
  .style-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .style-head .t{font-size:var(--text-md);font-weight:650;color:oklch(16% 0 0)}
  .style-head .close{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:50%;
    background:transparent;color:oklch(48% 0 0);cursor:pointer;font-size:20px;line-height:1}
  .style-head .close:hover{background:oklch(20% 0 0 / .06);color:oklch(16% 0 0)}
  .style-list{display:flex;flex-direction:column;gap:4px;max-height:252px;overflow-y:auto}
  .style-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:1px solid transparent;
    border-radius:10px;background:transparent;cursor:pointer;text-align:left;transition:.18s}
  .style-item:hover{background:oklch(20% 0 0 / .05)}
  .style-item.on{background:oklch(16% 0 0 / .06);border-color:oklch(16% 0 0 / .14)}
  .style-item .dot{width:9px;height:9px;border-radius:50%;background:oklch(52% .14 55);flex:none;
    box-shadow:0 0 8px oklch(60% .16 60 / .6)}
  .style-item .nm{font-size:13px;font-weight:600;color:oklch(20% 0 0)}
  .style-item .ds{font-size:11px;color:oklch(50% 0 0);margin-left:auto}
  /* 背景模式选择（对齐 Folia 背景注册表）：网格小卡 */
  .style-sec{font-size:11px;font-weight:650;letter-spacing:.06em;color:oklch(48% 0 0);
    margin:14px 2px 8px;text-transform:uppercase}
  .bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .bg-item{padding:9px 4px;border:1px solid var(--color-line);border-radius:10px;background:oklch(100% 0 0);
    cursor:pointer;text-align:center;transition:.18s;font-size:11px;font-weight:600;color:oklch(32% 0 0)}
  .bg-item:hover{background:oklch(20% 0 0 / .05)}
  .bg-item.on{background:oklch(16% 0 0 / .07);border-color:oklch(16% 0 0 / .35);color:oklch(12% 0 0)}
  /* 背景调节：暗角/通透开关 */
  .bg-tune{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:oklch(45% 0 0)}
  .bg-tune input[type=checkbox]{accent-color:oklch(18% 0 0);cursor:pointer;width:15px;height:15px}

  /* —— 底部控制 —— */
  .controls{flex:none;padding:6px 72px 28px}

  /* 进度条：声纹作为背景，播放头是圆点 */
  .progress-area{position:relative;height:56px;display:flex;align-items:center}
  .progress-area .wave-bg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  .progress{position:relative;z-index:1;width:100%;height:28px;cursor:pointer;display:flex;align-items:center}
  .progress .rail{width:100%;height:2px;border-radius:99px;background:oklch(20% 0 0 / .16)}
  .progress .fill{height:100%;width:32%;border-radius:99px;background:oklch(18% 0 0)}
  .progress .knob{position:absolute;left:32%;top:50%;width:12px;height:12px;border-radius:50%;
    background:oklch(18% 0 0);transform:translate(-50%,-50%);box-shadow:0 0 0 4px oklch(100% 0 0)}

  .time-row{display:flex;justify-content:space-between;margin-top:2px}
  .time{font-size:11px;letter-spacing:.04em;color:oklch(50% 0 0);font-variant-numeric:tabular-nums}
  /* 黑白之间的一抹暖红：当前播放时间着色（会跳动、是"活的"），总时长保持灰 */
  #curTime{color:oklch(52% .15 20)}

  /* 三列 grid：播放键绝对居中；EQ 在左组最左、顺序播放在右组最右，两侧对称 */
  .ctrl-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:0;margin-top:8px;position:relative}
  .ctrl-grp{display:flex;align-items:center;gap:14px}
  .ctrl-grp.start{justify-content:flex-end;margin-right:22px}   /* 拉开上一首与播放键的间距 */
  .ctrl-grp.end{justify-content:flex-start;margin-left:22px}   /* 拉开下一首与播放键的间距 */
  .ctrl{position:relative;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;
    background:transparent;color:oklch(38% 0 0);cursor:pointer;transition:color .2s,background .2s;flex:none}
  .ctrl:hover{color:oklch(10% 0 0);background:oklch(20% 0 0 / .05)}
  .ctrl:focus-visible{outline:2px solid oklch(40% 0 0);outline-offset:2px}
  .ctrl svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;
    stroke-linecap:round;stroke-linejoin:round}
  /* 大小阶梯：其他图标 20px < 上一首/下一首 26px < 播放键 30px */
  #prev svg,#next svg{width:26px;height:26px;fill:currentColor;stroke:none}
  .ctrl svg.fillIcon{fill:currentColor;stroke:none}
  .ctrl.on{color:oklch(14% 0 0)}
  .ctrl.on::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:oklch(14% 0 0);
    transform:translateY(15px)}
  .play-big{width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
    background:oklch(16% 0 0);color:oklch(100% 0 0);box-shadow:var(--shadow-sm);
    transition:transform .2s var(--ease),background .2s}
  .play-big:hover{background:oklch(8% 0 0);transform:scale(1.05)}
  .play-big:active{transform:scale(.96)}
  .play-big:focus-visible{outline:2px solid oklch(40% 0 0);outline-offset:3px}
  .play-big svg{width:30px;height:30px;fill:currentColor}
  /* —— EQ 均衡器面板 —— */
  .eq-mask{position:absolute;inset:0;z-index:8;background:oklch(16% 0 0 / .18);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .eq-mask.open{opacity:1;pointer-events:auto}
  .eq-panel{position:absolute;left:0;top:0;z-index:9;width:388px;padding:24px 26px 22px;
    background:oklch(100% 0 0);border:1px solid var(--color-line);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);opacity:0;transform:scale(.98);
    transform-origin:top right;pointer-events:none;transition:opacity .2s,transform .2s var(--ease)}
  .eq-panel.open{opacity:1;transform:none;pointer-events:auto}
  .eq-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;
    cursor:move;user-select:none}   /* 标题栏可拖动整个窗口 */
  .eq-head .t{font-size:var(--text-md);font-weight:650;color:oklch(16% 0 0);letter-spacing:.02em}
  .eq-head .close{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:50%;
    background:transparent;color:oklch(48% 0 0);cursor:pointer;font-size:20px;line-height:1}
  .eq-head .close:hover{background:oklch(20% 0 0 / .06);color:oklch(16% 0 0)}
  .eq-head .close:focus-visible{outline:2px solid oklch(40% 0 0);outline-offset:2px}
  .eq-presets{display:flex;flex-wrap:nowrap;justify-content:center;gap:6px;margin-bottom:22px}   /* 一排显示、居中，左右留白相等 */
  .eq-presets button{padding:5px 10px;border:1px solid var(--color-line);border-radius:99px;
    background:transparent;color:oklch(42% 0 0);font-size:10px;cursor:pointer;transition:all .2s;white-space:nowrap}
  .eq-presets button:hover{border-color:oklch(20% 0 0);color:oklch(16% 0 0)}
  .eq-presets button.on{background:oklch(16% 0 0);color:oklch(100% 0 0);border-color:oklch(16% 0 0)}
  .eq-bands{display:flex;justify-content:space-between;gap:12px}
  .eq-band{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1}
  .eq-band .val{font-size:10px;color:oklch(50% 0 0);font-variant-numeric:tabular-nums}
  .eq-band input[type=range]{width:100%;height:96px;margin:0;writing-mode:vertical-lr;direction:rtl;
    accent-color:oklch(18% 0 0);cursor:pointer}
  .eq-band input[type=range]:focus-visible{outline:2px solid oklch(40% 0 0);outline-offset:3px;border-radius:4px}
  .eq-band .label{font-size:10px;color:oklch(48% 0 0);letter-spacing:.02em}

  /* —— 全屏沉浸式歌词：Folia 情景式 ——
     背景由三层叠加：①封面虚化铺底 ②封面主色光晕（随歌切平滑换色）③可开关的暗角/通透遮罩。
     --c1/--c2/--c3 由 JS 从当前封面取色写入；--veil 控制暗角强度（越接近 0 越通透）。 —— */
  .fs-lyrics{position:absolute;inset:0;z-index:12;overflow:hidden;
    background:oklch(9% 0 0);opacity:0;transform:scale(1.02);pointer-events:none;
    transition:opacity .5s,transform .5s var(--ease);
    --c1:oklch(45% .05 230);--c2:oklch(35% .06 270);--c3:oklch(55% .04 190);
    --veil:1;--cover-op:1}
  .fs-lyrics.open{opacity:1;transform:none;pointer-events:auto}
  /* ① 封面虚化铺底：只虚化不压黑，主色参与背景 */
  .fs-bg{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;
    filter:blur(78px) saturate(1.15) brightness(.72);transform:scale(1.06);
    opacity:var(--cover-op);transition:opacity .7s ease}
  /* ② 封面主色光晕：三团柔和色光缓缓漂浮，随切歌原地平滑换色（对应 Folia useBlendedColors） */
  .fs-glow{position:absolute;inset:-10%;pointer-events:none;filter:blur(60px);opacity:.72;
    transition:opacity .6s}
  .fs-glow i{position:absolute;display:block;border-radius:50%;
    transition:background .9s ease;mix-blend-mode:screen}
  .fs-glow i.g1{width:62%;height:70%;left:-8%;top:-14%;background:var(--c1);animation:float1 18s ease-in-out infinite alternate}
  .fs-glow i.g2{width:58%;height:64%;right:-10%;top:6%;background:var(--c2);animation:float2 22s ease-in-out infinite alternate}
  .fs-glow i.g3{width:70%;height:52%;left:14%;bottom:-16%;background:var(--c3);animation:float3 26s ease-in-out infinite alternate}
  @keyframes float1{to{transform:translate(9%,7%) scale(1.12)}}
  @keyframes float2{to{transform:translate(-8%,10%) scale(1.08)}}
  @keyframes float3{to{transform:translate(6%,-8%) scale(1.14)}}
  /* ②b 星象（sora）：稀疏星点 canvas，最干净模式 */
  .fs-stars{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
  /* ②c 灵光（lumiere）：体积光束，随时间缓缓扫过 */
  .fs-rays{position:absolute;inset:-30%;display:none;pointer-events:none;mix-blend-mode:screen;
    background:conic-gradient(from 0deg at 50% 0%,transparent 0deg,color-mix(in oklch,var(--c3) 18%,transparent) 12deg,transparent 26deg,
      color-mix(in oklch,var(--c1) 16%,transparent) 44deg,transparent 60deg,color-mix(in oklch,var(--c2) 20%,transparent) 82deg,transparent 100deg,
      color-mix(in oklch,var(--c3) 14%,transparent) 128deg,transparent 150deg,color-mix(in oklch,var(--c1) 18%,transparent) 180deg,transparent 210deg);
    animation:raySpin 40s linear infinite;filter:blur(22px);opacity:.85}
  @keyframes raySpin{to{transform:rotate(360deg)}}
  /* ③ 遮罩：暗角开关/强度可调，--veil 越小越通透 */
  .fs-bg-veil{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,transparent 18%,oklch(6% 0 0 / calc(.52 * var(--veil))) 82%),
      linear-gradient(oklch(6% 0 0 / calc(.20 * var(--veil))),oklch(6% 0 0 / calc(.42 * var(--veil))))}
  /* 背景模式切换：由 data-bg 决定哪几层可见（对齐 Folia background registry 思想） */
  .fs-lyrics[data-bg="0"] .fs-glow,.fs-lyrics[data-bg="1"] .fs-glow,.fs-lyrics[data-bg="3"] .fs-glow{display:block}
  .fs-lyrics[data-bg="1"] .fs-bg{opacity:calc(var(--cover-op) * .35)}      /* 隐现流体：封面压低，突出光晕 */
  .fs-lyrics[data-bg="2"] .fs-stars{display:block}                          /* 星象 */
  .fs-lyrics[data-bg="2"] .fs-bg,.fs-lyrics[data-bg="2"] .fs-glow{display:none}
  .fs-lyrics[data-bg="3"] .fs-rays{display:block}                           /* 灵光 */

<script>
(function(){
  var BPM=84,beatMs=60000/BPM;
  function fit(cv){var dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;
    cv.width=w*dpr;cv.height=h*dpr;cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);return {w:w,h:h};}
  function pickColor(){
    var r=Math.random();
    if(r<0.10) return {h:6,  s:64, l:54};
    if(r<0.18) return {h:212,s:58, l:56};
    if(r<0.24) return {h:32, s:60, l:55};
    return {h:230,s:0,  l:44};
  }

  // 进度条背景声纹：低矮横向离子波，两端渐隐，播放头圆点叠在其上
  var cv=document.getElementById('wave'),cx=cv.getContext('2d'),W,N=150,pts=[];
  for(var j=0;j<N;j++)pts.push({ph:Math.random()*6.28,sp:.4+Math.random()*.9,y:Math.random()*2-1,c:pickColor()});
  function resize(){W=fit(cv);}
  addEventListener('resize',resize);resize();
  var playing=true,energy=1,targetEnergy=1;
  function drawWave(t){
    energy+=(targetEnergy-energy)*.06;
    cx.clearRect(0,0,W.w,W.h);
    var base=W.h*.5,span=W.w*.96,x0=W.w*.02;
    for(var i=0;i<N;i++){
      var p=pts[i],x=x0+span*i/(N-1);
      // 两端保留基础波动（.45），中间饱满（1.0）——整条进度条从头到尾都有律动
      var env=.45+.55*Math.sin(Math.PI*i/(N-1));
      var beatPhase=(((t-(i%6)*26)%beatMs)+beatMs)%beatMs/beatMs;
      var kick=Math.pow(1-beatPhase,2.2);
      var a=Math.sin(i*.30+p.ph+t*.0010*p.sp)*Math.sin(i*.09-t*.0006+p.ph);
      var envelope=Math.sin(i*.17-t*.0012)*Math.sin(i*.045+t*.0004);
      var amp=env*(6+13*Math.abs(a)*(.4+1.2*kick))*energy;    // 小画布幅度收紧
      var yy=base+envelope*amp*1.2+p.y*amp*.12;
      var hh=(1+Math.abs(a)*7*env*(.5+1.1*kick))*energy;
      var col=p.c;
      var al=Math.min(.5,(.08+.24*env*(.5+.6*kick)+.08*Math.abs(a)+(col.s?.16:0))*energy+.03);
      cx.strokeStyle='hsla('+col.h+','+col.s+'%,'+col.l+'%,'+al+')';
      cx.lineWidth=1;cx.lineCap='round';
      cx.beginPath();cx.moveTo(x,yy-hh);cx.lineTo(x,yy+hh);cx.stroke();
      cx.fillStyle='hsla('+col.h+','+col.s+'%,'+(col.l-4)+'%,'+(al*.9)+')';
      cx.beginPath();cx.arc(x,yy,1+Math.abs(a)*1.3,0,6.28);cx.fill();
    }
  }
  var fsLayer=document.getElementById('fsLyrics');
  function frame(t){
    drawWave(t);
    tickLyrics(t);   // 逐字时钟常态运行：非全屏中间歌词与全屏歌词同步律动
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // —— 曲目 + 歌词（本地占位，将来接后台数据）——
  // colors = 封面主色派生出的三团光晕色（对应 Folia 封面取色 → 背景配色）；实现阶段可由 canvas 自动取色替换
  var tracks=[
    {cn:'星尘漫游',en:'PLANET 2021',artist:'Olly Murs · Claude Kelly · Jarryd James',img:'assets/cover-focus.jpg',dur:'3:11',
      colors:['oklch(48% .07 220)','oklch(40% .08 265)','oklch(55% .05 185)'],

  // —— 逐字点亮动态演示：虚拟歌词时钟驱动，模拟 Folia 的逐字推进 ——
  var CHAR_MS=300,GAP_MS=560;                     // 每字时长 / 句间停顿
  var lyricPos=0,lastTickT=0,lastCharKey='';
  function lineDur(i){return tracks[idx].lyrics[i].length*CHAR_MS+GAP_MS;}
  function lineStart(i){var s=0;for(var k=0;k<i;k++)s+=lineDur(k);return s;}
  function totalDur(){var s=0;for(var k=0;k<tracks[idx].lyrics.length;k++)s+=lineDur(k);return s;}
  function tickLyrics(t){
    if(!lastTickT){lastTickT=t;return;}
    var dt=t-lastTickT;lastTickT=t;
    if(dt>200)dt=16;                              // 切后台回来保护，避免跳字
    if(playing)lyricPos+=dt;
    var total=totalDur();if(lyricPos>=total)lyricPos=0;
    // 由时钟推出当前句
    var lines=tracks[idx].lyrics,li=0,acc=0;
    for(;li<lines.length;li++){var d=lineDur(li);if(lyricPos<acc+d)break;acc+=d;}
    if(li>=lines.length)li=lines.length-1;
    var inLine=lyricPos-acc;
    var ci=Math.max(0,Math.min(lines[li].length-1,Math.floor(inLine/CHAR_MS)));
    // 句变化：同步主页 + 全屏高亮
    if(li!==activeLine){
      activeLine=li;
      var lb=document.getElementById('lyrics'),fb=document.getElementById('fsLines');
      if(lb){for(var q=0;q<lb.children.length;q++)lb.children[q].classList.toggle('active',q===li);}
      if(fb){for(var q2=0;q2<fb.children.length;q2++)fb.children[q2].classList.toggle('active',q2===li);}
    }
    // 逐字：已唱 sung、当前字 singing、未唱暗淡——两处容器同步（全屏与非全屏完全一致）
    var key=li+'_'+ci;
    if(key!==lastCharKey){
      lastCharKey=key;
      [lyricsBox,fsLinesBox].forEach(function(box){
        if(!box)return;
        var act=box.children[li];
        if(act){
          for(var c=0;c<act.children.length;c++){
            act.children[c].classList.toggle('sung',c<ci);
            act.children[c].classList.toggle('singing',c===ci);

    bands.forEach(function(b){

  document.addEventListener('pointercancel',eqDropEnd);
  document.getElementById('eqClose').addEventListener('click',function(){eqOpen(false);});
  eqMask.addEventListener('click',function(){eqOpen(false);});
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    // 按最上层优先关闭：样式面板 > EQ > 全屏
    if(stylePanel.classList.contains('open')){styleOpen(false);return;}
    if(eqPanel.classList.contains('open')){eqOpen(false);return;}
    if(fsLayer.classList.contains('open')){fsOpen(false);return;}
  });
  // —— 进度条点击/键盘（主界面 + 全屏浮动条共用）——
  var fill=document.getElementById('fill');
  function setProgress(p){
    if(!isFinite(p))p=0;               // 防止 NaN/undefined 导致进度错乱
    p=Math.max(0,Math.min(1,p));
    document.querySelectorAll('[data-role=fill]').forEach(function(f){f.style.width=(p*100)+'%';});
    document.querySelectorAll('[data-role=knob]').forEach(function(k){k.style.left=(p*100)+'%';});
  }
  document.querySelectorAll('[data-role=progress]').forEach(function(prog){
    prog.addEventListener('click',function(e){
      var r=prog.getBoundingClientRect();setProgress((e.clientX-r.left)/r.width);
    });
    prog.addEventListener('keydown',function(e){
      var cur=parseFloat(fill.style.width)||0;
      if(e.key==='ArrowRight'){setProgress((cur+5)/100);e.preventDefault();}
      if(e.key==='ArrowLeft'){setProgress((cur-5)/100);e.preventDefault();}
    });
  });
  // —— 浮动条其余按键：委托给主界面对应控件，保持同一套逻辑 ——
  var delegateMap={eq:'eqBtn',volume:'volume',queue:'queue'};
  Object.keys(delegateMap).forEach(function(act){
    document.querySelectorAll('.fs-dock [data-act="'+act+'"]').forEach(function(b){
      b.addEventListener('click',function(){document.getElementById(delegateMap[act]).click();});
    });
  });

  // —— 顶栏菜单：与首页同款，可点击跳转 ——
  document.getElementById('chips').addEventListener('click',function(e){
    var chip=e.target.closest('.chip');if(!chip)return;
    var view=chip.dataset.view;
    if(view==='正在播放')return;                      // 当前页，保持不动
    var url={'首页':'home.html','搜索':'search.html','歌单':'playlist.html','排行榜':'rank.html','沉浸模式':'immersive.html','设置':'settings.html'}[view];
    if(url){location.href=url;return;}
    // 设置：轻提示占位
    [].forEach.call(this.querySelectorAll('.chip'),function(c){c.classList.toggle('on',c===chip);});
    var toast=document.createElement('div');
    toast.className='nav-toast';toast.textContent='「'+view+'」页面制作中';
    document.body.appendChild(toast);
    setTimeout(function(){toast.classList.add('show');},10);
    setTimeout(function(){toast.classList.remove('show');setTimeout(function(){toast.remove();},300);},1600);
  });
})();
</script>
</body>
</html>
